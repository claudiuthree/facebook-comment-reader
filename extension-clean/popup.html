<!doctype html><html lang="en"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{width:320px;margin:0;padding:16px;background:#111b2a;color:#f5f8fc;font:14px system-ui,sans-serif}
h1{font-size:17px;margin:0 0 10px}p{line-height:1.4;margin:8px 0;color:#c6d6ec}button{padding:9px;border:1px solid #627996;border-radius:8px;background:#24364e;color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}#start{width:100%;background:#9fc7ff;color:#10203a;border:0;font-weight:700}#count,#position{font-size:12px}#comment{max-height:100px;overflow:auto;padding:8px;background:#1c2a3e;border-radius:7px;white-space:pre-wrap}nav{display:flex;gap:5px;margin:9px 0}nav button{flex:1;font-size:12px;padding:8px 3px}#clear,#show{width:100%;margin-top:5px}#status{min-height:20px;font-size:12px}#pin{font-size:11px;color:#9fb5d2;margin-top:12px}
</style><h1>Comment reader</h1><p id="count">Open a Facebook post to begin.</p><p id="position"></p><div id="comment" hidden></div><button id="start">Collect and play</button><nav><button id="previous" disabled>Previous</button><button id="play" disabled>Play</button><button id="next" disabled>Next</button><button id="stop" disabled>Stop</button></nav><button id="clear" disabled>Clear collection</button><button id="show" disabled>Open floating player</button><p id="status" role="status"></p><p id="pin">To keep this button in Chrome: Extensions menu, then Pin beside Facebook Comment Reader.</p><script src="popup.js"></script></html>
